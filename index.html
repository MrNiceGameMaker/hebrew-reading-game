<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b22">
  <meta name="firebase-project-id" content="learntoread-901d0">
  <meta name="firebase-web-api-key" content="AIzaSyAsuLE02IDNxjNK048X-5O1xqX2c2-ydl8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest?v=home">
  <link rel="apple-touch-icon" href="TemplateData/icon-180.png">
  <link rel="icon" href="TemplateData/icon-192.png">
  <title>משחקי אותיות</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b0b22; }
    #viewport { position: fixed; inset: 0; overflow: hidden; }
    #stage { position: absolute; inset: 0; }
    #stage.portrait-phone {
      inset: 50% auto auto 50%;
      width: var(--stage-width);
      height: var(--stage-height);
      transform: translate(-50%, -50%) rotate(90deg);
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status, #fullscreen, #retry { color: #fff; font: bold 1rem system-ui, sans-serif; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; }
    #status[hidden] { display: none; }
    #loading-avatar {
      justify-self: center;
      width: 112px;
      height: 112px;
      padding: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, #4c3575 0%, #241b4f 57%, transparent 72%);
      animation: greeting 1.5s ease-in-out infinite;
    }
    @keyframes greeting { 50% { transform: translateY(-10px) rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { #loading-avatar { animation: none; } }
    #player-name-dialog, #cloud-dialog {
      box-sizing: border-box;
      width: min(440px, calc(100% - 32px));
      max-height: calc(100% - 32px);
      padding: 20px;
      border: 1px solid #9d8ce0;
      border-radius: 20px;
      background: #1e1742;
      color: #f7f6ff;
      font: 700 1.15rem system-ui, sans-serif;
    }
    #player-name-dialog::backdrop, #cloud-dialog::backdrop { background: #09071cbd; }
    #player-name-form { display: grid; gap: 14px; }
    #player-name-input, #cloud-auth input:not([type=checkbox]) {
      box-sizing: border-box;
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #9d8ce0;
      border-radius: 10px;
      color: #f7f6ff;
      background: #100d2c;
      font: inherit;
    }
    #player-name-actions { display: flex; gap: 10px; }
    #player-name-actions button, #cloud-dialog button {
      min-height: 44px;
      flex: 1;
      border: 1px solid #9d8ce0;
      border-radius: 10px;
      padding: 8px;
      color: #f7f6ff;
      background: #352b61;
      font: inherit;
      cursor: pointer;
    }
    #player-name-actions button[type=submit] { color: #132737; background: #7fffdd; }
    #cloud-dialog { width: min(510px, calc(100% - 32px)); font-weight: 600; }
    #cloud-dialog h2 { margin: 0 0 12px; font-size: 1.5rem; }
    #cloud-auth:not([hidden]) { display: grid; gap: 9px; }
    #cloud-auth label { font-size: .95rem; }
    #cloud-import-label { margin: 3px 0; }
    .cloud-actions { display: flex; gap: 8px; margin: 6px 0; }
    #cloud-login, #cloud-sync-now { color: #132737; background: #7fffdd; }
    #cloud-status { min-height: 1.4em; margin: 12px 0 6px; font-size: .95rem; }
    #cloud-dialog button:disabled { opacity: .6; }
    #retry {
      justify-self: center;
      min-height: 48px;
      padding: 8px 20px;
      border: 1px solid #9d8ce0;
      border-radius: 12px;
      background: #272046;
      cursor: pointer;
    }
    #fullscreen {
      position: absolute;
      bottom: max(8px, env(safe-area-inset-bottom));
      left: max(8px, env(safe-area-inset-left));
      width: 44px;
      height: 44px;
      border: 1px solid #9d8ce0;
      border-radius: 12px;
      background: #272046;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .portrait-phone #fullscreen {
      bottom: max(8px, env(safe-area-inset-left));
      left: max(8px, env(safe-area-inset-top));
    }
    :fullscreen #fullscreen, .game-menu-fullscreen #fullscreen { display: none; }
    @media (display-mode: standalone), (display-mode: fullscreen) {
      #fullscreen { display: none; }
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <canvas id="game" aria-label="משחקי אותיות" tabindex="-1"></canvas>
      <div id="status">
        <img id="loading-avatar" width="112" height="112" alt="">
        <p id="loading-message" role="status">טוענים את המשחק…</p>
        <button id="retry" hidden>נסו שוב</button>
      </div>
      <button id="fullscreen" aria-label="מסך מלא" title="מסך מלא" hidden>⛶</button>
    </div>
  </div>
  <dialog id="player-name-dialog" aria-labelledby="player-name-label">
    <form id="player-name-form">
      <label id="player-name-label" for="player-name-input">שם הילד או הילדה</label>
      <input id="player-name-input" type="text" dir="auto" maxlength="24" autocomplete="off" autofocus>
      <div id="player-name-actions">
        <button type="submit">אישור</button>
        <button type="button" id="cancel-player-name">ביטול</button>
      </div>
    </form>
  </dialog>
  <dialog id="cloud-dialog" aria-labelledby="cloud-title">
    <h2 id="cloud-title">סנכרון להורים</h2>
    <form id="cloud-auth" hidden>
      <label for="cloud-email">דוא״ל של ההורה</label>
      <input id="cloud-email" type="email" autocomplete="username" dir="ltr" maxlength="254" required>
      <label for="cloud-password">סיסמה</label>
      <input id="cloud-password" type="password" autocomplete="current-password" dir="ltr" minlength="6" maxlength="100" required>
      <label id="cloud-import-label" hidden><input id="cloud-import" type="checkbox" checked> הוספת הפרופילים השמורים במכשיר לחשבון</label>
      <div class="cloud-actions">
        <button id="cloud-login" type="submit" value="login">כניסה</button>
        <button id="cloud-register" type="submit" value="register">פתיחת חשבון הורה</button>
      </div>
      <button id="cloud-recovery" type="submit" value="recover" formnovalidate>איפוס סיסמה</button>
    </form>
    <div id="cloud-signed-in" hidden>
      <div class="cloud-actions">
        <button id="cloud-sync-now" type="button">סנכרן עכשיו</button>
        <button id="cloud-sign-out" type="button">יציאה מהחשבון</button>
      </div>
    </div>
    <p id="cloud-status" role="status"></p>
    <button id="cloud-close" type="button">חזרה למשחק</button>
  </dialog>
  <script src="TemplateData/CloudProfiles.js?v=1.25"></script>
  <script>
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('game');
    const statusPanel = document.getElementById('status');
    const statusMessage = document.getElementById('loading-message');
    const retry = document.getElementById('retry');
    const fullscreen = document.getElementById('fullscreen');
    const touchScreen = matchMedia('(pointer: coarse)');
    const displayedCanvasBounds = canvas.getBoundingClientRect.bind(canvas);
    let rotated = false;
    let loadingAvatar = '1f407';
    try {
      const savedAvatar = localStorage.getItem('LearnToRead.LoadingAvatar');
      if (['1f407', '1f42c', '1f98a', '1f989', '1f438', '1f401', '1f43c'].includes(savedAvatar)) loadingAvatar = savedAvatar;
    } catch (error) {
      // A new game or a browser that blocks storage uses the rabbit.
    }
    document.getElementById('loading-avatar').src = 'TemplateData/Avatars/' + loadingAvatar + '.png';

    const nameDialog = document.getElementById('player-name-dialog');
    const nameInput = document.getElementById('player-name-input');
    let nameTarget;
    let unityInstance;
    let cloudTarget;
    window.learnToReadReadCloudSnapshot = (target, local) => {
      cloudTarget = target;
      return window.learnToReadCloud?.readSnapshot(local) ?? local;
    };
    window.learnToReadEditPlayerName = (target, value) => {
      nameTarget = target;
      nameInput.value = value;
      nameDialog.showModal();
      nameInput.focus();
    };
    document.getElementById('player-name-form').addEventListener('submit', event => {
      event.preventDefault();
      const value = nameInput.value;
      nameDialog.close();
      unityInstance.SendMessage(nameTarget, 'SetPlayerName', value);
    });
    document.getElementById('cancel-player-name').onclick = () => nameDialog.close();
    nameDialog.addEventListener('close', () => {
      nameInput.value = '';
      canvas.focus();
    });

    function fitStage() {
      rotated = touchScreen.matches && innerHeight > innerWidth;
      stage.classList.toggle('portrait-phone', rotated);
      if (rotated) {
        stage.style.setProperty('--stage-width', innerHeight + 'px');
        stage.style.setProperty('--stage-height', innerWidth + 'px');
      }
    }
    fitStage();
    window.addEventListener('resize', fitStage);
    touchScreen.addEventListener?.('change', fitStage);

    // Unity sizes its render buffer from the canvas rectangle. Supply its
    // landscape dimensions even when the browser is showing it sideways.
    canvas.getBoundingClientRect = () => {
      const rect = displayedCanvasBounds();
      return rotated ? new DOMRect(rect.left, rect.top, rect.height, rect.width) : rect;
    };

    function mapPoint(point, rect) {
      const x = rect.left + (point.clientY - rect.top);
      const y = rect.top + (rect.right - point.clientX);
      Object.defineProperties(point, {
        clientX: { value: x, configurable: true },
        clientY: { value: y, configurable: true },
        pageX: { value: x + scrollX, configurable: true },
        pageY: { value: y + scrollY, configurable: true }
      });
    }

    // Rotate the coordinates before Unity handles the trusted browser events.
    for (const type of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) {
      window.addEventListener(type, event => {
        if (!rotated) return;
        const rect = displayedCanvasBounds();
        const points = new Set([...Array.from(event.touches), ...Array.from(event.changedTouches),
          ...Array.from(event.targetTouches)]);
        for (const point of points) {
          if (point.target === canvas) mapPoint(point, rect);
        }
      }, { capture: true, passive: true });
    }
    for (const type of ['mousedown', 'mousemove', 'mouseup']) {
      window.addEventListener(type, event => {
        if (rotated && event.target === canvas) mapPoint(event, displayedCanvasBounds());
      }, { capture: true, passive: true });
    }

    const build = 'Build/';
    const version = "1.25";
    const versionKey = 'LearnToRead.WebVersion';
    let loadingTitle = 'טוענים את המשחק…';
    try {
      const previousVersion = localStorage.getItem(versionKey);
      const playedBeforeVersionTracking = !previousVersion && localStorage.getItem('LearnToRead.LoadingAvatar');
      if ((previousVersion && previousVersion !== version) || playedBeforeVersionTracking)
        loadingTitle = 'מוריד עדכון…';
    } catch (error) {
      // A browser that blocks storage can still open the game.
    }
    statusMessage.textContent = loadingTitle;
    const assetUrl = file => build + file + '?v=' + encodeURIComponent(version);
    const config = {
      dataUrl: assetUrl('Web.data.unityweb'),
      frameworkUrl: assetUrl('Web.framework.js.unityweb'),
      codeUrl: assetUrl('Web.wasm.unityweb'),
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "LearnToRead",
      productName: "LearnToRead",
      productVersion: version,
      cacheControl: url => /\.(?:bundle|unityweb)(?:\?|$)/.test(url) ? 'immutable' : 'no-store',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
    const loader = document.createElement('script');
    loader.src = assetUrl('Web.loader.js');
    const showError = error => {
      statusMessage.textContent = 'המשחק לא נטען. בדקו את החיבור לאינטרנט ונסו שוב.';
      retry.hidden = false;
      console.error(error);
    };
    retry.onclick = () => location.reload();
    loader.onerror = showError;
    loader.onload = () => {
      createUnityInstance(canvas, config, progress => {
        statusMessage.textContent = loadingTitle + ' ' + Math.round(progress * 100) + '%';
      }).then(instance => {
        unityInstance = instance;
        window.learnToReadCloud?.attach(() => {
          if (cloudTarget) instance.SendMessage(cloudTarget, 'RefreshCloudProfiles');
        });
        try { localStorage.setItem(versionKey, version); } catch (error) { /* Storage is optional. */ }
        statusPanel.hidden = true;
        fullscreen.hidden = !document.fullscreenEnabled;
        fullscreen.onclick = () => document.documentElement.requestFullscreen().catch(console.warn);
      }).catch(showError);
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
