<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest?v=home">
  <link rel="apple-touch-icon" href="TemplateData/icon-180.png">
  <link rel="icon" href="TemplateData/icon-192.png">
  <title>משחקי אותיות</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b0b22; }
    #viewport { position: fixed; inset: 0; overflow: hidden; }
    #stage { position: absolute; inset: 0; }
    #stage.portrait-phone {
      inset: 50% auto auto 50%;
      width: var(--stage-width);
      height: var(--stage-height);
      transform: translate(-50%, -50%) rotate(90deg);
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status, #fullscreen, #retry { color: #fff; font: bold 1rem system-ui, sans-serif; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; }
    #status[hidden] { display: none; }
    #retry {
      justify-self: center;
      min-height: 48px;
      padding: 8px 20px;
      border: 1px solid #9d8ce0;
      border-radius: 12px;
      background: #272046;
      cursor: pointer;
    }
    #fullscreen {
      position: absolute;
      bottom: max(8px, env(safe-area-inset-bottom));
      left: max(8px, env(safe-area-inset-left));
      width: 44px;
      height: 44px;
      border: 1px solid #9d8ce0;
      border-radius: 12px;
      background: #272046;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .portrait-phone #fullscreen {
      bottom: max(8px, env(safe-area-inset-left));
      left: max(8px, env(safe-area-inset-top));
    }
    :fullscreen #fullscreen { display: none; }
    @media (display-mode: standalone), (display-mode: fullscreen) {
      #fullscreen { display: none; }
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <canvas id="game" aria-label="משחקי אותיות" tabindex="-1"></canvas>
      <div id="status">
        <p id="loading-message" role="status">טוענים את המשחק…</p>
        <button id="retry" hidden>נסו שוב</button>
      </div>
      <button id="fullscreen" aria-label="מסך מלא" title="מסך מלא" hidden>⛶</button>
    </div>
  </div>
  <script>
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('game');
    const statusPanel = document.getElementById('status');
    const statusMessage = document.getElementById('loading-message');
    const retry = document.getElementById('retry');
    const fullscreen = document.getElementById('fullscreen');
    const touchScreen = matchMedia('(pointer: coarse)');
    const displayedCanvasBounds = canvas.getBoundingClientRect.bind(canvas);
    let rotated = false;

    function fitStage() {
      rotated = touchScreen.matches && innerHeight > innerWidth;
      stage.classList.toggle('portrait-phone', rotated);
      if (rotated) {
        stage.style.setProperty('--stage-width', innerHeight + 'px');
        stage.style.setProperty('--stage-height', innerWidth + 'px');
      }
    }
    fitStage();
    window.addEventListener('resize', fitStage);
    touchScreen.addEventListener?.('change', fitStage);

    // Unity sizes its render buffer from the canvas rectangle. Supply its
    // landscape dimensions even when the browser is showing it sideways.
    canvas.getBoundingClientRect = () => {
      const rect = displayedCanvasBounds();
      return rotated ? new DOMRect(rect.left, rect.top, rect.height, rect.width) : rect;
    };

    function mapPoint(point, rect) {
      const x = rect.left + (point.clientY - rect.top);
      const y = rect.top + (rect.right - point.clientX);
      Object.defineProperties(point, {
        clientX: { value: x, configurable: true },
        clientY: { value: y, configurable: true },
        pageX: { value: x + scrollX, configurable: true },
        pageY: { value: y + scrollY, configurable: true }
      });
    }

    // Rotate the coordinates before Unity handles the trusted browser events.
    for (const type of ['touchstart', 'touchmove', 'touchend', 'touchcancel']) {
      window.addEventListener(type, event => {
        if (!rotated) return;
        const rect = displayedCanvasBounds();
        const points = new Set([...Array.from(event.touches), ...Array.from(event.changedTouches),
          ...Array.from(event.targetTouches)]);
        for (const point of points) {
          if (point.target === canvas) mapPoint(point, rect);
        }
      }, { capture: true, passive: true });
    }
    for (const type of ['mousedown', 'mousemove', 'mouseup']) {
      window.addEventListener(type, event => {
        if (rotated && event.target === canvas) mapPoint(event, displayedCanvasBounds());
      }, { capture: true, passive: true });
    }

    const build = 'Build/';
    const version = "1.1";
    const assetUrl = file => build + file + '?v=' + encodeURIComponent(version);
    const config = {
      dataUrl: assetUrl('Web.data.unityweb'),
      frameworkUrl: assetUrl('Web.framework.js.unityweb'),
      codeUrl: assetUrl('Web.wasm.unityweb'),
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "LearnToRead",
      productName: "LearnToRead",
      productVersion: version,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };
    const loader = document.createElement('script');
    loader.src = assetUrl('Web.loader.js');
    const showError = error => {
      statusMessage.textContent = 'המשחק לא נטען. בדקו את החיבור לאינטרנט ונסו שוב.';
      retry.hidden = false;
      console.error(error);
    };
    retry.onclick = () => location.reload();
    loader.onerror = showError;
    loader.onload = () => {
      createUnityInstance(canvas, config, progress => {
        statusMessage.textContent = 'טוענים את המשחק… ' + Math.round(progress * 100) + '%';
      }).then(() => {
        statusPanel.hidden = true;
        fullscreen.hidden = !document.fullscreenEnabled;
        fullscreen.onclick = () => document.documentElement.requestFullscreen().catch(console.warn);
      }).catch(showError);
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
